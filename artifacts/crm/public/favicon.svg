<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark rounded background -->
  <rect width="180" height="180" rx="36" fill="#0f1a0f"/>
  <!-- Green glow layer -->
  <rect width="180" height="180" rx="36" fill="url(#glow)" opacity="0.4"/>
  <!-- Lightning bolt -->
  <path d="M105 20L55 100H90L75 160L135 72H98L105 20Z" fill="#22c55e"/>
  <!-- Highlight on bolt -->
  <path d="M105 20L55 100H90L75 160L135 72H98L105 20Z" fill="url(#shine)" opacity="0.3"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#0f1a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="55" y1="20" x2="135" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
